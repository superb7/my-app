name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main  # main 브랜치에 푸시될 때 트리거

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]

    env:
      APP_NAME: myapp
      JAR_NAME: my-app-0.0.1-SNAPSHOT.jar
      APP_DIR: /opt/myapp

    steps:
    # 소스 코드 체크아웃
    - name: Checkout repository
      uses: actions/checkout@v4

    # JDK 21 설정
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # gradlew 권한 설정
    - name: Set gradlew permissions
      run: |
        chmod +x ./gradlew

    # Gradle 캐시 추가 (빌드 속도 개선)
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    # gradle 빌드
    - name: Build application
      run: ./gradlew clean build -x test

    # 파일 이동
    - name: Move JAR file to target directory
      run: | 
         rm -f $APP_DIR/*.jar
         mv $(ls build/libs/*.jar | grep -v 'plain.jar') $APP_DIR/$JAR_NAME

    # 애플리케이션 재시작
    - name: Restart application
      shell: bash
      run: |
         set -euo pipefail

         echo "Step 1: Restart service"
         sudo -n /usr/bin/systemctl restart "$APP_NAME"

         echo "Step 2: Check service"
         sudo -n /usr/bin/systemctl is-active --quiet "$APP_NAME"

         echo "Step 3: Show service status"
         sudo -n /usr/bin/systemctl --no-pager --full status "$APP_NAME"

         echo "Deployment completed successfully."
