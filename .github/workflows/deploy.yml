name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main  # main 브랜치에 푸시될 때 트리거

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]

    env:
      JAR_NAME: my-app-0.0.1-SNAPSHOT.jar
      APP_DIR: /opt/myapp

    steps:
    # 소스 코드 체크아웃
    - name: Checkout repository
      uses: actions/checkout@v4

    # JDK 21 설정
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # gradlew 권한 설정
    - name: Set gradlew permissions
      run: |
        chmod +x ./gradlew

    # Gradle 캐시 추가 (빌드 속도 개선)
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    # gradle 빌드
    - name: Build application
      run: ./gradlew clean build -x test

    # 파일 이동
    - name: Move JAR file to target directory
      run: | 
         rm -f $APP_DIR/*.jar
         mv $(ls build/libs/*.jar | grep -v 'plain.jar') $APP_DIR/$JAR_NAME

    # 실행
    - name: Run application
      run: |

        # 기존 로그 삭제
        : > "$APP_DIR/log.txt"

        # 기존 실행중인 프로세스 삭제
        # pkill -f "java -jar.*$JAR_NAME" || true
        # nohup java -jar "$APP_DIR/$JAR_NAME" > "$APP_DIR/log.txt" 2>&1 &

        # pkill -f my-app-0.0.1-SNAPSHOT.jar || true
        nohup java -jar /opt/myapp/my-app-0.0.1-SNAPSHOT.jar > /opt/myapp/log.txt 2>&1 &
