<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring</title>
<link th:href="@{/dist/images/h.png}" rel="icon">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Nunito:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap">
  
<!-- Vendor CSS Files -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/dist/vendor/perfect-scrollbar/perfect-scrollbar.css}" type="text/css">

<link rel="stylesheet" th:href="@{/dist/css/core.css}" type="text/css">
<link rel="stylesheet" th:href="@{/dist/css/main.css}" type="text/css">
<link rel="stylesheet" th:href="@{/dist/css/forms.css}" type="text/css">

<style type="text/css">
  .logo {
      font-size: 1.9rem;
      font-weight: 600;
  }
  .logo .logo-text, .logo .dot {
      display: inline-block;
      color: #333;
  }
  .logo .logo-text::first-letter {
      color: #ff5733;
  }
</style>
</head>

<body>

<main>
	<div class="container d-flex align-items-center justify-content-center min-vh-100">
		<div class="" style="max-width: 500px; width: 100%;">
			<div class="text-center">
				<div class="mb-4">
					<a th:href="@{/}" class="logo d-inline-block">
						<i class="bi bi-stars"></i> <span class="logo-text">SPRING</span><span class="dot">.</span>
					</a>
				</div>
	
				<h1 class="error-code fw-bold text-primary mb-2">403</h1>
				<h2 class="card-title h4 mb-3">Forbidden</h2>
				<p class="text-muted mb-4">You are unauthorized to see this page.</p>
	
				<button type="button" class="btn-accent btn-lg" onclick="javascript:history.back();">
					Go to Back
				</button>
			</div>
		</div>
	</div>
</main>

<!-- Vendor JS Files -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>	
<script type="text/javascript" src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script type="text/javascript" th:src="@{/dist/vendor/perfect-scrollbar/perfect-scrollbar.min.js}"></script>

<!-- Core JS Files -->
<script type="text/javascript" th:src="@{/dist/js/core.js}"></script>
<script type="text/javascript" th:src="@{/dist/js/util.js}"></script>

</body>

</html>
